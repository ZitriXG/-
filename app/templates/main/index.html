{% extends 'base.html' %}
{% block title %}Главная{% endblock %}
{% block content %}
<div class="hero">
    <h1>Добро пожаловать!</h1>
    <p>Курсовая работа с базой данных — управление профилем пользователя.</p>
    {% if not current_user.is_authenticated %}
        <div class="hero-actions">
            <a href="{{ url_for('auth.register') }}" class="btn btn-primary">Создать аккаунт</a>
            <a href="{{ url_for('auth.login') }}" class="btn btn-outline">Войти</a>
        </div>
    {% else %}
        <div class="hero-actions">
            <a href="{{ url_for('profile.index') }}" class="btn btn-primary">Мой профиль</a>
            <a href="{{ url_for('profile.settings') }}" class="btn btn-outline">Настройки</a>
        </div>
    {% endif %}
</div>
{% endblock %}
